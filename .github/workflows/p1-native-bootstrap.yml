name: Cineo P1 native bootstrap

on:
  pull_request:
    paths:
      - 'scripts/bootstrap-native.sh'
      - 'scripts/cineo_native_overlay.py'
      - 'native/OrbitIntegration/**'
      - 'Packages/CineoDirector/**'
      - '.github/workflows/p1-native-bootstrap.yml'
      - 'docs/decisions/**'
      - 'scripts/native-smoke-doctor.sh'
      - 'scripts/test-cineo.sh'
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap-native.sh'
      - 'scripts/cineo_native_overlay.py'
      - 'native/OrbitIntegration/**'
      - 'Packages/CineoDirector/**'
      - 'scripts/native-smoke-doctor.sh'
      - 'scripts/test-cineo.sh'
      - '.github/workflows/p1-native-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bootstrap:
    name: P1 Cineo named bundle compile
    runs-on: macos-26
    timeout-minutes: 55
    env:
      CINEO_NATIVE_ROOT: ${{ github.workspace }}/.cineo-build
    steps:
      - uses: actions/checkout@v4
      - name: Environment and static checks
        run: |
          uname -a
          xcodebuild -version
          bash -n scripts/bootstrap-native.sh
          python3 -m py_compile scripts/cineo_native_overlay.py
          bash scripts/bootstrap-native.sh --plan
      - name: Check one-command runner on real macOS
        run: |
          bash -n scripts/test-cineo.sh
          bash scripts/test-cineo.sh --preflight
          # Regression: Apple CommandLineTools shims must fail BEFORE clone.
          if env DEVELOPER_DIR=/Library/Developer/CommandLineTools \
            bash scripts/test-cineo.sh --preflight > "$RUNNER_TEMP/clt-preflight.log" 2>&1; then
            echo "FAIL: CLT-only configuration was unexpectedly accepted" >&2
            exit 1
          fi
          grep -F 'Full Xcode is not selected' "$RUNNER_TEMP/clt-preflight.log"
          bash scripts/test-cineo.sh --help
      - name: Compile isolated Cineo bundle
        run: bash scripts/bootstrap-native.sh --build
      - name: Native bridge tests with synthetic telemetry (no screen permissions)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project "$CINEO_NATIVE_ROOT/orbit/Reco.xcodeproj" \
            -scheme Reco -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$CINEO_NATIVE_ROOT/DerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:RecoTests/CineoAutoZoomBridgeTests \
            -only-testing:RecoTests/CineoCameraMotionTests \
            CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee "$CINEO_NATIVE_ROOT/logs/cineo-bridge-tests.log"
      - name: Check compiled bundle metadata (not capture)
        run: |
          bash -n scripts/native-smoke-doctor.sh
          bash scripts/native-smoke-doctor.sh --app ".cineo-build/DerivedData/Build/Products/Debug/Cineo.app" --allow-unsigned
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-cineo-native-build-evidence
          path: |
            .cineo-build/logs/
            .cineo-build/UPSTREAM-ORBIT-LICENSE.txt
          retention-days: 7
          if-no-files-found: warn
