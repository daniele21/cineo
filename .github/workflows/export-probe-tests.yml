name: Cineo export probe compile

on:
  pull_request:
    paths:
      - 'Packages/CineoExportProbe/**'
      - '.github/workflows/export-probe-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Packages/CineoExportProbe/**'
      - '.github/workflows/export-probe-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-probe:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift toolchain
        run: swift --version
      - name: Build metadata inspector (no real recording required)
        run: swift build --package-path Packages/CineoExportProbe --configuration release
