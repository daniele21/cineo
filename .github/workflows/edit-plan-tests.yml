name: CineoEditPlanner tests

on:
  pull_request:
    paths:
      - 'Packages/CineoDirector/**'
      - 'Packages/CineoProject/**'
      - 'Packages/CineoEditPlanner/**'
      - '.github/workflows/edit-plan-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Packages/CineoDirector/**'
      - 'Packages/CineoProject/**'
      - 'Packages/CineoEditPlanner/**'
      - '.github/workflows/edit-plan-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edit-plan-tests:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify output timeline and camera suggestion integration
        run: swift test --package-path Packages/CineoEditPlanner
