name: CineoProject model tests

on:
  pull_request:
    paths:
      - 'Packages/CineoProject/**'
      - '.github/workflows/project-model-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Packages/CineoProject/**'
      - '.github/workflows/project-model-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-swift-project-tests:
    name: Project schema, persistence and timeline tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test CineoProject
        run: swift test --package-path Packages/CineoProject
