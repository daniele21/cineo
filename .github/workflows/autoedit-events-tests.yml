name: Cineo privacy-safe pointer events

on:
  pull_request:
    paths:
      - 'Packages/CineoEvents/**'
      - '.github/workflows/autoedit-events-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test mouse-only schema, timebase and storage
        run: swift test --package-path Packages/CineoEvents
