name: Cineo native app CLT-only build

on:
  pull_request:
    paths:
      - 'Apps/Cineo/**'
      - 'Apps/CineoCLTSmoke/**'
      - 'scripts/swift-test-clt.sh'
      - 'scripts/test-cineo.sh'
      - 'Packages/CineoDirector/**'
      - 'Packages/CineoProject/**'
      - 'Packages/CineoEditPlanner/**'
      - 'scripts/build-cineo-clt.sh'
      - '.github/workflows/clt-native-cineo.yml'
  push:
    branches: [main]
    paths:
      - 'Apps/Cineo/**'
      - 'Apps/CineoCLTSmoke/**'
      - 'scripts/swift-test-clt.sh'
      - 'scripts/test-cineo.sh'
      - 'Packages/CineoDirector/**'
      - 'Packages/CineoProject/**'
      - 'Packages/CineoEditPlanner/**'
      - 'scripts/build-cineo-clt.sh'
      - '.github/workflows/clt-native-cineo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-native:
    name: SwiftPM Cineo app and ad-hoc signing (no Xcode)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v4
      - name: Verify real CLT environment
        run: |
          set -euo pipefail
          test "$(xcode-select -p)" = /Library/Developer/CommandLineTools
          xcrun --sdk macosx --show-sdk-path
          swift --version
          bash -n scripts/build-cineo-clt.sh
          bash -n scripts/swift-test-clt.sh
          bash -n scripts/test-cineo.sh
          bash scripts/test-cineo.sh --preflight
      - name: Compile and package real screen recorder
        env:
          CINEO_CLT_BUILD_ROOT: ${{ runner.temp }}/cineo-capture
        run: |
          set -euo pipefail
          bash scripts/test-cineo.sh --native
          test -x "$CINEO_CLT_BUILD_ROOT/Cineo.app/Contents/MacOS/Cineo"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$CINEO_CLT_BUILD_ROOT/Cineo.app/Contents/Info.plist")" = com.daniele21.cineo.capturealpha
          codesign --verify --strict "$CINEO_CLT_BUILD_ROOT/Cineo.app"
          echo "Native Cineo app packaged under standalone CLT."
      - name: Package distinctly identified Stop Fix candidate
        env:
          CINEO_CLT_BUILD_ROOT: ${{ runner.temp }}/cineo-stopfix
          CINEO_CLT_ISOLATED_CAPTURE: '1'
        run: |
          set -euo pipefail
          bash scripts/build-cineo-clt.sh
          app="$CINEO_CLT_BUILD_ROOT/Cineo Stop Fix.app"
          test -x "$app/Contents/MacOS/Cineo"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.daniele21.cineo.capturealpha.stopfix
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Contents/Info.plist")" = "Cineo Stop Fix"
          codesign --verify --strict "$app"
          echo "PASS: isolated capture candidate signed and verified."

  clt-core-smoke:
    name: Core algorithm smoke without Swift Testing macros (CLT only)
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v4
      - name: Run camera project edit algorithm smoke without Xcode
        run: |
          set -euo pipefail
          test "$(xcode-select -p)" = /Library/Developer/CommandLineTools
          bash scripts/test-cineo.sh --quick
