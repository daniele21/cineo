name: Cineo native app CLT-only build

on:
  pull_request:
    paths:
      - 'Apps/Cineo/**'
      - 'Apps/CineoCLTSmoke/**'
      - 'scripts/swift-test-clt.sh'
      - 'scripts/test-cineo.sh'
      - 'Packages/CineoDirector/**'
      - 'Packages/CineoProject/**'
      - 'Packages/CineoEditPlanner/**'
      - 'scripts/build-cineo-clt.sh'
      - 'scripts/ensure-cineo-signing.sh'
      - '.github/workflows/clt-native-cineo.yml'
  push:
    branches: [main]
    paths:
      - 'Apps/Cineo/**'
      - 'Apps/CineoCLTSmoke/**'
      - 'scripts/swift-test-clt.sh'
      - 'scripts/test-cineo.sh'
      - 'Packages/CineoDirector/**'
      - 'Packages/CineoProject/**'
      - 'Packages/CineoEditPlanner/**'
      - 'scripts/build-cineo-clt.sh'
      - 'scripts/ensure-cineo-signing.sh'
      - '.github/workflows/clt-native-cineo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-native:
    name: SwiftPM Cineo app and ad-hoc signing (no Xcode)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      CINEO_SIGNING_MODE: adhoc
    steps:
      - uses: actions/checkout@v4
      - name: Verify real CLT environment
        run: |
          set -euo pipefail
          test "$(xcode-select -p)" = /Library/Developer/CommandLineTools
          xcrun --sdk macosx --show-sdk-path
          swift --version
          bash -n scripts/build-cineo-clt.sh
          bash -n scripts/ensure-cineo-signing.sh
          bash -n scripts/swift-test-clt.sh
          bash -n scripts/test-cineo.sh
          bash scripts/test-cineo.sh --preflight
      - name: Compile and package real screen recorder
        env:
          CINEO_CLT_BUILD_ROOT: ${{ runner.temp }}/cineo-capture
        run: |
          set -euo pipefail
          bash scripts/test-cineo.sh --native
          app="$CINEO_CLT_BUILD_ROOT/Cineo Dev.app"
          test -x "$app/Contents/MacOS/Cineo"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.daniele21.cineo.capturealpha.dev
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Contents/Info.plist")" = "Cineo Dev"
          codesign --verify --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CineoSourceCommit' "$app/Contents/Info.plist")" = "$(git rev-parse --short=12 HEAD)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CineoCaptureImplementation' "$app/Contents/Info.plist")" = "stream-stop-v2"
          echo "Native Cineo Dev app packaged with one stable bundle identity under standalone CLT."

  # A separate job exercises persistent signing with an ephemeral CI Keychain.
  # It never imports/exports the developer's real signing certificate.
  persistent-signing:
    name: Stable designated requirement across rebuilds (no Xcode)
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      CINEO_SIGNING_MODE: persistent
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap a temporary signing identity and prove requirement stability
        run: |
          set -euo pipefail
          export CINEO_SIGNING_KEYCHAIN="$RUNNER_TEMP/cineo-persistent-ci.keychain-db"
          export CINEO_SIGNING_HOME="$RUNNER_TEMP/cineo-persistent-signing"
          export CINEO_CLT_BUILD_ROOT="$RUNNER_TEMP/cineo-persistent-app"
          security create-keychain -p "cineo-ci-temporary" "$CINEO_SIGNING_KEYCHAIN"
          security unlock-keychain -p "cineo-ci-temporary" "$CINEO_SIGNING_KEYCHAIN"
          first="$(bash scripts/ensure-cineo-signing.sh)"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "cineo-ci-temporary" "$CINEO_SIGNING_KEYCHAIN"
          second="$(bash scripts/ensure-cineo-signing.sh)"
          test "$first" = "$second"
          bash scripts/build-cineo-clt.sh
          app="$CINEO_CLT_BUILD_ROOT/Cineo Dev.app"
          req_before="$(codesign -d -r- "$app" 2>&1 | grep 'designated =>')"
          test -n "$req_before"
          if grep -qi 'cdhash' <<< "$req_before"; then exit 1; fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 2" "$app/Contents/Info.plist"
          codesign --force --sign "$first" --timestamp=none --keychain "$CINEO_SIGNING_KEYCHAIN" "$app"
          codesign --verify --strict "$app"
          req_after="$(codesign -d -r- "$app" 2>&1 | grep 'designated =>')"
          test "$req_before" = "$req_after"
          echo "PASS: signing identity reused; designated requirement unchanged across modified app versions."

  clt-core-smoke:
    name: Core algorithm smoke without Swift Testing macros (CLT only)
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v4
      - name: Run camera project edit algorithm smoke without Xcode
        run: |
          set -euo pipefail
          test "$(xcode-select -p)" = /Library/Developer/CommandLineTools
          bash scripts/test-cineo.sh --quick
