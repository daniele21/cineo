name: Cineo Studio integrated CLT-only rendering

on:
  pull_request:
    paths:
      - 'Apps/Cineo/**'
      - 'Packages/CineoScene/**'
      - 'Packages/CineoMusic/**'
      - 'Packages/CineoAudio/**'
      - 'Tools/CineoACEWatchdog/**'
      - 'scripts/test-cineo-engine-lifecycle.sh'
      - '.github/workflows/cineo-studio-clt-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog-lifecycle:
    name: ACE child supervision (quit and forced crash)
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner-pipe closure and SIGKILL owner cleanup
        run: bash scripts/test-cineo-engine-lifecycle.sh

  geometry:
    name: Pure Swift scene geometry tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic plan, timebase and crop tests
        run: swift test --package-path Packages/CineoScene

  music-contract:
    name: Local ACE-Step request and multipart contract
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test local music adapter (no model required)
        run: swift test --package-path Packages/CineoMusic

  real-frames-synthetic:
    name: Native H264 edited frame export without Xcode
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Apple Command Line Tools, not Xcode
        run: |
          test "$(xcode-select -p)" = /Library/Developer/CommandLineTools
          xcrun --sdk macosx --show-sdk-path
          swift --version
      # Apple's CLT-only macOS runner lacks the Swift TestingMacros
      # plugin. Test pure Foundation geometry in Linux Swift 6.2 above;
      # retain real AVFoundation/Core Image native smoke on macOS below.
      - name: Generate and re-render synthetic H264 with shared preview/export compositor
        run: |
          swift run --package-path Packages/CineoScene --configuration release cineo-scene-smoke
      - name: Real local audio smoke (H264 + WAV, crossfade loop and ducked MP4)
        run: |
          swift run --package-path Packages/CineoAudio --configuration release cineo-audio-smoke
      - name: Reject SwiftUI @State macros unavailable in Apple CLT
        run: |
          # Apple CLT Swift 6.3 ships SwiftUI but not the host SwiftUIMacros
          # plugin required by @State. @StateObject/ObservableObject work.
          if grep -En '@State[[:space:]]' Apps/Cineo/Sources/Cineo/*.swift; then
            echo 'ERROR: SwiftUI @State macro requires unavailable CLT SwiftUIMacros. Use @StateObject with an ObservableObject.' >&2
            exit 1
          fi
      - name: Build integrated SwiftUI Cineo Dev app without Xcode
        run: |
          swift build --package-path Apps/Cineo --configuration release
          echo 'CLT Studio integration compiles. Interactive UI/TCC requires a physical Mac test.'
      - name: Package and verify official branded app (CI-only ad-hoc signature)
        env:
          CINEO_SIGNING_MODE: adhoc
          CINEO_CLT_BUILD_ROOT: ${{ runner.temp }}/cineo-branded
        run: |
          bash scripts/build-cineo-clt.sh
          app="$CINEO_CLT_BUILD_ROOT/Cineo Dev.app"
          test -s "$app/Contents/Resources/Cineo.icns"
          test -s "$app/Contents/Resources/CineoSymbol.png"
          test -s "$app/Contents/Resources/CineoWordmark.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = Cineo
          codesign --verify --strict "$app"
          echo "PASS: official Cineo assets present inside signed CLT app."

