name: CineoDirector tests

on:
  pull_request:
    paths:
      - 'Packages/CineoDirector/**'
      - '.github/workflows/director-tests.yml'
  push:
    paths:
      - 'Packages/CineoDirector/**'
      - '.github/workflows/director-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-tests:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run pure Swift tests
        run: swift test --package-path Packages/CineoDirector
